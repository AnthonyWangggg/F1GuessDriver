name: Source checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check && pnpm lint && pnpm build && pnpm deploy:build
      - run: pnpm exec vitest run apps packages tests/game-rules --exclude tests/game-rules/poles-v2.spec.ts
      - run: pnpm security:scan
      - run: pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org
      # No environment, production key, pull_request_target or self-hosted runner here.
      # Source-only tests do not certify private historical fixtures or production readiness.
