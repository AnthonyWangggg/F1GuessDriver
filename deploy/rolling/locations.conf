# Candidate only. Retain the server-level TLS, security headers, mTLS and logging policy.
# Include security-headers.conf in locations that add headers: Nginx inheritance is all-or-nothing.
location ~ ^/api/drivers/[^/]+$ { return 404; }
location = /api/ready {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://f1guess_active;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
# Operational capability probe: loopback only, no sessions or business writes.
location = /api/runtime-readiness {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://f1guess_active;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location /api/ {
    proxy_pass http://f1guess_active;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_next_upstream off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}
location /assets/ {
    alias /opt/f1guessdriver/rolling/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /opt/f1guessdriver/rolling/routing/security-headers.conf;
}
location = /index.html { expires -1; }
location /flags/ { try_files $uri =404; expires -1; }
location / { try_files $uri $uri/ /index.html; expires -1; }
