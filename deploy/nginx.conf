# Replace example.invalid and provision certificates separately. No public deployment is performed.
server {
    listen 80;
    server_name guess.example.invalid;
    return 308 https://guess.example.invalid$request_uri;
}
server {
    listen 443 ssl;
    server_name guess.example.invalid;
    ssl_certificate /etc/letsencrypt/live/guess.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guess.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/f1-guess/current/apps/web/dist;
    client_max_body_size 8k;
    server_tokens off;
    # No request URLs, query strings, Cookie or Authorization in access logs.
    access_log off;
    error_log /var/log/nginx/f1-guess-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite user-controlled forwarding headers; one local Nginx hop only.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    # Readiness performs database checks; expose it only to local monitoring.
    location = /api/ready {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; }
}
